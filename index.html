 return `<section class="card"><div class="row"><h3>Tu semana</h3><span class="chip">${n} de 6</span></div><div class="week">${D.map((d,i)=>`<div class="wd ${ok[i]===2?'on':ok[i]===1?'wait':''} ${i===td?'td':''}" style="animation-delay:${(.2+i*.1).toFixed(1)}s"><b>${ok[i]===2?'✓':ok[i]===1?'⏳':''}</b><small>${d}</small></div>`).join('')}</div>${wp}<small>${n===6?'¡Semana completa! 🎉':'Visitanos de lunes a sábado y completá la semana para ganar un premio.'}</small></section>`}
async function cumpleBanner(){const l=await rpc('cumples_proximos',{p_dias:2}).catch(()=>[]);if(!l||!l.length)return '';return `<div class="card bday"><div class="cake" style="font-size:2.4rem">🎂</div><h3>Cumpleaños cerca</h3>${l.map(x=>`<div class="row" style="justify-content:flex-start;gap:12px;margin:8px 0;text-align:left">${AV(x,44)}<span style="flex:1"><b>${esc(x.nombre)} ${esc(x.apellido)}</b><br><small>${rel(x.dias)} · cumple ${x.edad}</small></span><span class="chip">${x.regalo?'Regalo entregado':x.vis>=x.req?'Regalo pendiente':'Sin visitas suficientes'}</span></div>`).join('')}<button class="alt sm" data-a="sub" data-s="cumples">Ver todos</button></div>`}
P.resumen=async()=>await cumpleBanner()+await P.resumen0();
P.cumples=async()=>{const l=await rpc('cumples_proximos',{p_dias:45});return `<p class="mut">Próximos 45 días. El regalo se entrega solo cuando el cliente abre la app ${cfg.cumple_dias_antes||2} días antes; si no entra, entregalo desde acá. Creá el regalo en Premios → "Regalo de cumpleaños".</p>`+((l||[]).map(x=>`<div class="card ${x.dias===0?'bday':''}"><div class="row" style="justify-content:flex-start;gap:12px;flex-wrap:nowrap;text-align:left">${AV(x,52)}<span style="flex:1"><b>${esc(x.nombre)} ${esc(x.apellido)}</b><br><small>Cumple ${x.edad} · ${new Date(x.fecha+'T12:00:00').toLocaleDateString('es-AR',{day:'numeric',month:'long'})} · ${rel(x.dias)}</small>${x.telefono?`<br><small><a href="tel:${esc(x.telefono)}">${esc(x.telefono)}</a></small>`:''}</span></div><div class="row"><span class="chip">${x.regalo?'✅ Regalo entregado':x.vis>=x.req?'⏳ Regalo pendiente':'Sin visitas suficientes'}</span><small>${x.vis}/${x.req} visitas en el año</small>${x.regalo||x.vis<x.req?'':`<button class="sm" data-a="regalo" data-id="${x.id}">Entregar regalo ahora</button>`}</div></div>`).join('')||'<p class="mut">No hay cumpleaños en los próximos 45 días.</p>')};
A.regalo=async d=>{const n=await rpc('entregar_regalo_cumple',{p_cliente:d.id});toast(n>0?'Regalo entregado ✓':'No hay un regalo de cumpleaños activo. Creá uno en Premios.');go('panel')};
async function cumpleAlert(){const l=await rpc('cumples_proximos',{p_dias:2}).catch(()=>[]);if(!l||!l.length)return;const k='cumpleAlert_'+new Date().toDateString(),n=new Date(),m=n.getHours()*60+n.getMinutes();if(localStorage[k])return;
 const show=()=>{if(localStorage[k])return;localStorage[k]='1';celebrate();modal(`<div class="tour"><div class="te">🎂</div><h3>Cumpleaños</h3>${l.map(x=>`<div class="row" style="justify-content:flex-start;gap:12px;margin:10px 0;text-align:left">${AV(x,48)}<span style="flex:1"><b>${esc(x.nombre)} ${esc(x.apellido)}</b><br><small>${rel(x.dias)} · cumple ${x.edad}</small></span></div>`).join('')}<button class="big" data-a="vcum">Ver cumpleaños</button></div>`)};
 if(m>=570)show();else setTimeout(show,(570-m)*60000)}
A.vcum=()=>{closeM();sub='cumples';go('panel')};
const slot=(t,ic,ti,de,all)=>{const p=(all||[]).find(x=>x.tipo===t);return `<div class="card lad">${p&&p.imagen_url?`<img class="thumb" alt="" src="${esc(p.imagen_url)}">`:`<div class="thumb ph">${ic}</div>`}<div style="flex:1"><span class="chip">${ic} ${ti}</span><h3 style="margin-top:6px">${p?esc(p.nombre):'Sin configurar'}</h3><p class="mut">${p?esc(p.descripcion):de}</p><div class="row"><button class="sm" data-a="slot" data-t="${t}" data-id="${p?p.id:''}">${p?'Editar':'Configurar'}</button>${p?`<button class="sm ${p.activa?'':'alt'}" data-a="tp" data-id="${p.id}" data-v="${p.activa?'':'1'}">${p.activa?'Activo ✓':'Pausado'}</button>`:''}</div></div></div>`};
A.slot=async d=>{let p={};if(d.id){const r=await db.from('promociones').select('*').eq('id',d.id).single();p=r.data||{}}
 modal(`<h3>${p.id?'Editar':'Configurar'} ${d.t==='semana'?'premio semanal':'regalo de cumpleaños'}</h3><form data-f="slot">${d.t==='cumple'?`<p class="note">Regla: el cliente recibe este regalo solo si tiene al menos ${cfg.cumple_visitas_min||20} visitas aprobadas en los últimos 12 meses (se cambia en Ajustes).</p>`:''}<input type="hidden" name="id" value="${esc(p.id||'')}"><input type="hidden" name="tipo" value="${d.t}"><label>Nombre del premio<input name="nombre" required value="${esc(p.nombre)}" placeholder="${d.t==='semana'?'Ej: Café y medialuna gratis':'Ej: Torta de cumpleaños'}"></label><label>Descripción<textarea name="descripcion" placeholder="Qué incluye">${esc(p.descripcion)}</textarea></label>${p.imagen_url?`<img class="cap" alt="" src="${esc(p.imagen_url)}" style="max-height:170px;object-fit:cover">`:''}<label>Foto del premio${p.imagen_url?' (elegí otra para reemplazarla)':''}<input type="file" name="foto" accept="image/*"></label><label>Stock (vacío = ilimitado)<input name="stock" type="number" min="0" value="${p.stock??''}"></label><label>Condiciones<textarea name="condiciones">${esc(p.condiciones)}</textarea></label><button class="big" style="margin-top:12px">Guardar</button></form>`)};
F.slot=async(f,v)=>{const img=v.foto&&v.foto.size?await up('promos',v.foto):null,o={nombre:v.nombre,descripcion:v.descripcion,condiciones:v.condiciones||null,stock:v.stock===''?null:+v.stock};if(img)o.imagen_url=img;
 if(v.id){const{error}=await db.from('promociones').update(o).eq('id',v.id);if(error)throw error}else{const{error}=await db.from('promociones').insert({...o,tipo:v.tipo,visitas_req:0,puntos_req:0,limite_cliente:1,activa:true});if(error)throw error}
 closeM();toast('Premio guardado ✓');go('panel')};
const fail=()=>{if(!app.innerHTML.trim())app.innerHTML='<div style="padding:60px 24px;text-align:center"><h2>No se pudo iniciar</h2><p class="mut">Revisá tu conexión y reintentá.</p><button class="big" onclick="location.reload()">Reintentar</button></div>'};
addEventListener('error',fail);addEventListener('unhandledrejection',fail);setTimeout(fail,8000);
function errView(e){console.error(e);app.innerHTML=`<div class="auth" style="padding:60px 24px;text-align:center"><h2>No se pudo iniciar</h2><p class="mut">${esc((e&&e.message)||e)}</p><button class="big" onclick="location.reload()">Reintentar</button><button class="ghost" style="margin-top:10px" onclick="Object.keys(localStorage).filter(k=>k.indexOf('sb-')===0).forEach(k=>localStorage.removeItem(k));location.reload()">Borrar sesión y reintentar</button></div>`}
A.dcli=d=>modal(`<h3>¿Eliminar a ${esc(d.n)}?</h3><p class="mut">Se borran su cuenta, sus visitas, puntos y premios. No se puede deshacer. Si solo querés bloquearlo, usá "Suspender".</p><button class="big danger" data-a="dcli2" data-id="${d.id}">Sí, eliminar definitivamente</button><button class="ghost big" style="margin-top:8px" data-a="cm">Cancelar</button>`);
A.dcli2=async d=>{await rpc('eliminar_cliente',{p_uid:d.id});closeM();toast('Cliente eliminado');go('panel')};
const tema=()=>localStorage.getItem('tema')||'dark',themeIcon=()=>({dark:'🌙',light:'☀️',auto:'🌓'})[tema()]||'🌙';
function applyTheme(){const t=tema(),h=new Date().getHours(),e=t==='auto'?(h>=7&&h<19?'light':'dark'):t;document.documentElement.dataset.th=e;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=e==='light'?'#eef1f5':'#120e0b'}
A.tema=()=>{const n={dark:'light',light:'auto',auto:'dark'}[tema()]||'light';localStorage.tema=n;applyTheme();document.querySelectorAll('[data-a=tema]').forEach(b=>b.textContent=themeIcon());toast({light:'Tema claro ☀️',auto:'Automático 🌓 · claro de 7:00 a 19:00',dark:'Tema oscuro 🌙'}[n])};
applyTheme();setInterval(applyTheme,60000);
let lastV=null,lastC=null;
function badges(v,c){const a=$('#bd'),b=$('#bdc');if(a){a.textContent=v;a.hidden=!v}if(b){b.textContent=c;b.hidden=!c}}
async function chk(){if(!isStaff())return;const s=await rpc('stats').catch(()=>null);if(!s)return;const v=+s.pendientes||0,c=+s.canjes_sol||0;badges(v,c);
 const nv=lastV!==null&&v>lastV,nc=lastC!==null&&c>lastC,ch=lastV!==v||lastC!==c;lastV=v;lastC=c;
 if(nc)alertaDe('canjes');else if(nv)alertaDe('solicitudes');
 if(ch&&tab==='panel'&&['resumen','solicitudes','canjes'].includes(sub))go('panel')}
async function alertaDe(k){let t='🔔 Nueva solicitud';try{if(k==='canjes'){const{data}=await db.from('canjes').select('promo_nombre,profiles(nombre,apellido)').eq('estado','solicitado').order('solicitado_en',{ascending:false}).limit(1);const c=data&&data[0];if(c)t=`🔔 ${c.profiles?.nombre||''} ${c.profiles?.apellido||''} quiere canjear: ${c.promo_nombre}`}else{const{data}=await db.from('visitas').select('profiles(nombre,apellido)').eq('estado','pendiente').order('creada',{ascending:false}).limit(1);const c=data&&data[0];if(c)t=`📍 ${c.profiles?.nombre||''} ${c.profiles?.apellido||''} pide registrar su visita`}}catch{}
 document.querySelectorAll('.alertb,.blinkfx').forEach(e=>e.remove());
 const f=document.createElement('div');f.className='blinkfx';const b=document.createElement('button');b.className='alertb';b.textContent=t+' · Tocá para ver';
 b.onclick=()=>{b.remove();f.remove();sub=k;go('panel')};document.body.append(f,b);if(navigator.vibrate)navigator.vibrate([250,120,250]);play('sello',.6);
 setTimeout(()=>f.remove(),10000);setTimeout(()=>b.remove(),30000)}
setInterval(()=>{if(isStaff()&&!document.hidden)chk()},15000);
let ip=null;const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true,isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e});addEventListener('appinstalled',()=>{ip=null;localStorage.inst='1'});
const instCard=()=>isStandalone()?'':`<section class="card inst"><div class="row" style="flex-wrap:nowrap;gap:14px;justify-content:flex-start"><div style="font-size:2.4rem">📲</div><div style="flex:1;text-align:left"><h3 style="margin:0">Instalá AGUARIBAY como app</h3><small>Abrila desde tu pantalla de inicio, sin navegador.</small></div></div><button class="big" style="margin-top:12px" data-a="instalar">Instalar app</button></section>`;
A.instalar=async()=>{closeM();if(ip){const p=ip;ip=null;p.prompt();const r=await p.userChoice.catch(()=>null);if(r&&r.outcome==='accepted'){localStorage.inst='1';toast('¡Instalando AGUARIBAY! 📲')}return}
 modal(`<div class="tour"><div class="te">📲</div><h3>Instalar la app</h3>${isIOS()?'<ol class="steps" style="text-align:left"><li>Tocá el botón <b>Compartir</b> (el cuadrado con la flecha) de Safari.</li><li>Elegí <b>Agregar a pantalla de inicio</b>.</li><li>Tocá <b>Agregar</b>.</li></ol>':'<ol class="steps" style="text-align:left"><li>Abrí el menú del navegador (los tres puntos ⋮).</li><li>Tocá <b>Instalar app</b> o <b>Agregar a pantalla de inicio</b>.</li><li>Confirmá con <b>Instalar</b>.</li></ol>'}<button class="big" style="margin-top:12px" data-a="cm">Entendido</button></div>`)};
function askInstall(){if(isStandalone()||isStaff()||localStorage.inst==='1')return;if(Date.now()-(+localStorage.instNo||0)<6048e5||document.querySelector('.modal'))return;modal(`<div class="tour"><div class="te">📲</div><h3>¿Querés instalar AGUARIBAY como app?</h3><p class="mut">Tené tus sellos y premios a un toque, desde tu pantalla de inicio, sin abrir el navegador.</p><button class="big" data-a="instalar">Sí, instalar</button><button class="ghost" style="margin-top:8px" data-a="noinst">Ahora no</button></div>`)}
A.noinst=()=>{localStorage.instNo=Date.now();closeM()};
async function shrink(file,max=900){const b=await createImageBitmap(file),k=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.82))}
async function up(bucket,file,folder){const bl=await shrink(file),p=(folder?folder+'/':'')+Date.now()+'.jpg',{error}=await db.storage.from(bucket).upload(p,bl,{contentType:'image/jpeg'});if(error)throw error;return db.storage.from(bucket).getPublicUrl(p).data.publicUrl}
CH.foto=async f=>{const u=await up('avatares',f,me.id),{error}=await db.from('profiles').update({foto_url:u}).eq('id',me.id);if(error)throw error;me.foto_url=u;toast('Foto actualizada ✓');shell();go('perfil')};
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&el.files[0])Promise.resolve(CH[el.dataset.chg](el.files[0])).catch(x=>toast(msg(x),1))});

P.cuenta=async()=>`${instCard()}<div class="card"><p class="mut">Sesión: ${esc(me.email)}</p><form data-f="pw"><label>Nueva contraseña (mínimo 8)<input name=password type=password minlength=8 required></label><button class="big" style="margin-top:12px">Cambiar contraseña</button></form></div><button class="alt big" data-a="salir">Cerrar sesión</button>`;
F.pw=async(f,v)=>{const{error}=await db.auth.updateUser({password:v.password});if(error)throw error;toast('Contraseña actualizada ✓');f.reset()};
boot();
